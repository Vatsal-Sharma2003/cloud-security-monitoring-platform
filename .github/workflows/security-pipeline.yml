name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Format Check
      run: terraform fmt -check

    - name: Terraform Init
      run: terraform init

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .

    - name: Run Bandit
      run: |
        pip install bandit
        bandit -r lambda/ || true

    - name: Build Docker Image
      run: docker build -t cloud-security-platform .

    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'cloud-security-platform'
        format: 'table'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'

