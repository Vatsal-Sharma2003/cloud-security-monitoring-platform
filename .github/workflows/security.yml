name: Security Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t security-api .

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: security-api
