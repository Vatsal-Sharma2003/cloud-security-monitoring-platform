apiVersion: apps/v1
kind: Deployment

metadata:
  name: security-api-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: security-api

  template:
    metadata:
      labels:
        app: security-api

    spec:
      containers:
      - name: security-api

        image: cloud-security-project-security-api:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5000